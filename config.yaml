name: "WP Forecast AI"
version: "0.1.0"
slug: "wp_forecast_ai"
description: "Wärmepumpenprognose mit MariaDB und MQTT Discovery"
arch: [amd64, aarch64, armv7, armhf, i386]
startup: services
boot: auto
init: false
homeassistant_api: true
hassio_api: true
options:
  timezone: Europe/Vienna
  mariadb_host: core-mariadb
  mariadb_port: 3306
  mariadb_database: homeassistant
  mariadb_username: homeassistant
  mariadb_password: ""
  mqtt_host: core-mosquitto
  mqtt_port: 1883
  mqtt_username: ""
  mqtt_password: ""
  mqtt_topic_prefix: wp_forecast_ai
  entity_heat_actual: sensor.heizung_tageswarme
  entity_power_actual: sensor.heizung_tagesstrom
  entity_cop_actual: sensor.heizung_tages_cop
  entity_pv_today: sensor.none_prognose_heute
  entity_pv_tomorrow: sensor.none_prognose_morgen
  entity_temperature_history: sensor.aussentemperatur_median
  entity_weather_forecast: sensor.wettervorhersage
  weather_forecast_attribute: daily
  weather_datetime_key: datetime
  weather_temperature_key: temperature
  monthly_train_day: 1
schema:
  timezone: str
  mariadb_host: str
  mariadb_port: int
  mariadb_database: str
  mariadb_username: str
  mariadb_password: password
  mqtt_host: str
  mqtt_port: int
  mqtt_username: str?
  mqtt_password: password?
  mqtt_topic_prefix: str
  entity_heat_actual: str
  entity_power_actual: str
  entity_cop_actual: str
  entity_pv_today: str
  entity_pv_tomorrow: str
  entity_temperature_history: str
  entity_weather_forecast: str
  weather_forecast_attribute: str
  weather_datetime_key: str
  weather_temperature_key: str
  monthly_train_day: int
